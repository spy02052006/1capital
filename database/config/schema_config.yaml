# ============================================================================
# Global Settings
# ============================================================================
global_settings:
  # Add source_file and timestamp metadata to each record
  add_metadata: true
  metadata_fields:
    - source_file  # Filename of Excel file being loaded
    - loaded_at    # Timestamp when record was inserted
    - updated_at   # Timestamp when record was last updated
  
  # Duplicate detection settings
  duplicate_detection:
    enabled: true
    method: "row_hash"  # hash all columns to detect exact duplicates
    log_duplicates: true
    skip_duplicates: true  # Skip if exact duplicate exists in DB
  
  # Data validation settings
  validation:
    strict_mode: false  # True = fail entire batch on any error; False = log errors but continue
    log_validation_errors: true
    max_errors_per_file: 1000
